[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flakehunter"
version = "0.1.0"
description = "Detects flaky tests from CI results and fixes them with an AI agent, verified by reruns."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.36",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/flakehunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
